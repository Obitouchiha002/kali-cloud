<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Kali-Cloud</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2836;--accent:#367bf0;--accent2:#00d4aa;--text:#e6edf3;--dim:#8b98a9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(800px 400px at 50% -10%,rgba(54,123,240,.14),transparent 70%)}
  a{color:var(--accent2);text-decoration:none}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;justify-content:center;margin-bottom:6px}
  .logo .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 12px var(--accent2)}
  h1{font-size:22px;text-align:center;margin:14px 0 4px}
  p.sub{text-align:center;color:var(--dim);font-size:14px;margin-bottom:24px}
  label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
  input{width:100%;background:#0c1017;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:15px;color:var(--text)}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;margin-top:22px;transition:.15s}
  button:hover{filter:brightness(1.12)} button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:#ff6b6b}.msg.ok{color:var(--accent2)}
  .switch{text-align:center;margin-top:20px;font-size:14px;color:var(--dim)}
  .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--dim)}
  .terms{text-align:center;font-size:12px;color:var(--dim);margin-top:16px;line-height:1.6}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span class="dot"></span> Kali-Cloud</div>
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Welcome back — launch your Kali desktop.</p>

    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      <button id="submit" type="submit">Sign in</button>
    </form>
    <div class="msg" id="msg"></div>

    <div class="switch" id="switch">
      New here? <a href="#" id="toggle">Create a free account</a>
    </div>
    <div class="terms" id="terms" style="display:none">
      By creating an account you agree to our
      <a href="/legal/terms.html" target="_blank">Terms</a> and
      <a href="/legal/acceptable-use.html" target="_blank">Acceptable Use</a>.
    </div>
    <a class="back" href="/">← Back to home</a>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "login"; // or "register"

function setMode(m) {
  mode = m;
  const reg = m === "register";
  $("title").textContent = reg ? "Create your account" : "Sign in";
  $("subtitle").textContent = reg ? "Free for students. No install needed." : "Welcome back — launch your Kali desktop.";
  $("submit").textContent = reg ? "Create account" : "Sign in";
  $("password").autocomplete = reg ? "new-password" : "current-password";
  $("switch").innerHTML = reg
    ? 'Already have an account? <a href="#" id="toggle">Sign in</a>'
    : 'New here? <a href="#" id="toggle">Create a free account</a>';
  $("terms").style.display = reg ? "block" : "none";
  $("msg").textContent = "";
  $("toggle").onclick = (e) => { e.preventDefault(); setMode(reg ? "login" : "register"); };
}
$("toggle").onclick = (e) => { e.preventDefault(); setMode("register"); };

// if already signed in, go straight to the app
fetch("/api/auth/me").then(r => { if (r.ok) location.href = "/app"; }).catch(() => {});

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("submit").disabled = true;
  $("msg").textContent = "";
  const email = $("email").value.trim();
  const password = $("password").value;
  try {
    const r = await fetch(`/api/auth/${mode}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Something went wrong.");
    $("msg").className = "msg ok";
    $("msg").textContent = "Success! Taking you in…";
    setTimeout(() => location.href = "/app", 600);
  } catch (err) {
    $("msg").className = "msg err";
    $("msg").textContent = err.message;
    $("submit").disabled = false;
  }
};
</script>
</body>
</html>
